name: Generate Worked-On Repo Pin Card

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate Worked-On Repo pin card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: pin
          options: username=Dmitri-Viggo-Barks&repo=ShadeGlide
          path: profile/pin-worked--on.svg
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git diff --cached --quiet || git commit -m "workflow: update repo pin card"
          git push
