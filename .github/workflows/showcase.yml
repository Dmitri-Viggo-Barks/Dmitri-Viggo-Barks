name: Update Worked-on Repositories

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README with worked-on repositories
        uses: sansk/github-repo-display@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          username: Dmitri-Viggo-Barks
          topic: wip-current
          format: card
          title: ""
          show_description: true
          show_language: true
          show_stars: true
          show_forks: false
          show_topics: false
